<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F1A1B">
<title>Remote — AI coffee &amp; chat</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1F1A1B;--fg:#EDE8E1;--dim:#9C9490;--ochre:#C9891E;--wine:#5B1A28;--line:#3A3234;--key:#332A2C}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:Figtree,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
  .dot{width:9px;height:9px;border-radius:50%;background:#B3372B;flex:none}
  .dot.ok{background:#4E9A5B}
  .where{flex:1;color:var(--dim);font-size:15px}
  .timer{font-size:22px;font-weight:600;color:var(--ochre);letter-spacing:.02em;background:none;border:0;font-family:inherit;padding:4px 0}
  .timer.off{color:var(--dim)}
  main{flex:1;overflow:auto;padding:18px 18px 8px;-webkit-overflow-scrolling:touch}
  h1{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:28px;line-height:1.1;margin:0 0 12px;letter-spacing:-.01em}
  .notes{font-size:17px;line-height:1.5}
  .notes p{margin:0 0 .7em}
  .notes .t{color:var(--ochre);font-weight:600;margin-right:.5em}
  .next{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:15px}
  .next b{color:var(--fg);font-weight:500}
  .empty{color:var(--dim)}
  .jump{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line)}
  .jump button{width:34px;height:34px;border-radius:17px;border:1px solid var(--line);background:none;
    color:var(--dim);font:inherit;font-size:14px;font-variant-numeric:tabular-nums}
  .jump button.cur{background:var(--ochre);border-color:var(--ochre);color:var(--bg);font-weight:600}
  .ctl{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px 18px 14px}
  .ctl button{height:76px;border-radius:14px;border:0;font:inherit;font-size:20px;font-weight:600;
    color:var(--fg);background:var(--key);touch-action:manipulation}
  .ctl .go{background:var(--wine)}
  .ctl button:active{filter:brightness(1.3)}
  :focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
</style>
</head>
<body>
<div class="top">
  <span class="dot" id="dot"></span>
  <span class="where" id="where">Connecting</span>
  <button class="timer off" id="timer" aria-label="Talk timer. Tap to start or pause, double tap to reset">00:00</button>
</div>
<main id="main"><p class="empty">Waiting for the deck. Open the slides on the laptop from this same server and this page follows along.</p></main>
<div class="jump" id="jump"></div>
<div class="ctl">
  <button id="back">Back</button>
  <button class="go" id="go">Next</button>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let total=0, cur=-1;

  function send(action, extra){
    fetch('/cmd',{method:'POST',body:JSON.stringify(Object.assign({type:'cmd',action},extra||{}))}).catch(()=>{});
  }

  // timer: tap starts/pauses, double tap resets; Next starts it automatically
  let acc=0, t0=null, running=false, tick=null;
  const timer=$('timer');
  const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  const paint=()=>{timer.textContent=fmt(acc+(running?Date.now()-t0:0))};
  function start(){if(running)return;running=true;t0=Date.now();timer.classList.remove('off');tick=setInterval(paint,500)}
  function pause(){if(!running)return;acc+=Date.now()-t0;running=false;clearInterval(tick);timer.classList.add('off');paint()}
  timer.addEventListener('click',()=>running?pause():start());
  timer.addEventListener('dblclick',()=>{pause();acc=0;paint()});

  // keep the screen on once the page has been tapped
  let wl=null;
  async function lock(){try{wl=await navigator.wakeLock.request('screen')}catch(_){}}
  document.addEventListener('click',()=>{if(!wl&&'wakeLock' in navigator)lock()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&wl)lock()});

  function jump(){
    const j=$('jump');
    if(j.children.length!==total){
      j.innerHTML='';
      for(let k=0;k<total;k++){
        const b=document.createElement('button');b.textContent=k+1;
        b.addEventListener('click',()=>send('goto',{i:k}));j.appendChild(b);
      }
    }
    [...j.children].forEach((b,k)=>b.classList.toggle('cur',k===cur));
  }

  function state(m){
    total=m.n; cur=m.i;
    $('where').textContent='Slide '+(m.i+1)+' of '+m.n+(m.fragTotal?', build '+m.frag+' of '+m.fragTotal:'');
    $('main').innerHTML=
      '<h1>'+esc(m.title||'(untitled)')+'</h1>'+
      '<div class="notes">'+(m.notes&&m.notes.trim()?m.notes:'<p class="empty">No notes for this slide.</p>')+'</div>'+
      (m.next?'<p class="next">Next up: <b>'+esc(m.next)+'</b></p>':'<p class="next">Last slide.</p>');
    $('main').scrollTop=0;
    jump();
  }

  const es=new EventSource('/events');
  es.onopen=()=>{$('dot').classList.add('ok');if(cur<0)$('where').textContent='Connected, waiting for the deck'};
  es.onerror=()=>{$('dot').classList.remove('ok')};
  es.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}if(m.type==='state')state(m)};

  $('go').addEventListener('click',()=>{send('next');start()});
  $('back').addEventListener('click',()=>send('prev'));

  let tx=null;
  $('main').addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX},{passive:true});
  $('main').addEventListener('touchend',e=>{
    if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;
    if(Math.abs(dx)>60){if(dx<0){send('next');start()}else send('prev')}
  },{passive:true});
})();
</script>
</body>
</html>
