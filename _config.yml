# Jekyll configuration file

title: Patrick van Staveren
email: trick@vanstaveren.us
description: >-
  Just a few more bytes on the Internet.
baseurl: ""
url: "http://trick.vanstaveren.us"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-last-modified-at
#  - jekyll-feed

last-modified-at:
    git-authordate: True

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - push
  - build
  - develop
  - revert-generated
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - presentations/2026-06-gpsl/node_modules
  - presentations/2026-06-gpsl/package.json
  - presentations/2026-06-gpsl/package-lock.json
  - presentations/2026-06-gpsl/vite.config.ts
  - presentations/2026-06-gpsl/netlify.toml
  - presentations/2026-06-gpsl/vercel.json
  - presentations/2026-06-gpsl/githooks
  - presentations/2026-06-gpsl/README.md
  - presentations/2026-semur-revillage-ai/CLAUDE.md
  - presentations/2026-semur-revillage-ai/serve.py
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - "*.local"
  - "*.orig"
  - "*.patch"
